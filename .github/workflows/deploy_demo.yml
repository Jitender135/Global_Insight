name: Build & Update Appetize Live Demo

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload & Update Appetize.io Live Demo
        run: |
          curl --location --request POST 'https://api.appetize.io/v1/apps/b_yqpk4go7brlicoezty3lvcqawy' \
          --header 'Authorization: Bearer ${{ secrets.APPETIZE_API_TOKEN }}' \
          --form 'file=@"app/build/outputs/apk/debug/app-debug.apk"' \
          --form 'platform="android"'
