name: Automated Tests & Appetize Live Demo

on:
  push:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m pytest backend/tests --verbose

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Test Suite
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload & Update Appetize.io Live Demo
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -n "$APPETIZE_TOKEN" ]; then
            curl --fail --location --request POST 'https://api.appetize.io/v1/apps/b_yqpk4go7brlicoezty3lvcqawy' \
            --header "Authorization: Bearer $APPETIZE_TOKEN" \
            --form 'file=@"app/build/outputs/apk/debug/app-debug.apk"' \
            --form 'platform="android"'
          else
            echo "APPETIZE_API_TOKEN secret not configured yet. Skipping upload step."
          fi
